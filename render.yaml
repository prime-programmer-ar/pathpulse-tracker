# Render.com deployment config for PathPulse
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pathpulse
    runtime: node
    region: oregon
    plan: free
    # Next.js standalone build: must copy static assets and public folder manually
    buildCommand: >
      npm install &&
      npx prisma generate &&
      npx prisma db push &&
      npm run build &&
      cp -r .next/static .next/standalone/.next/static &&
      cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/opt/render/project/src/db/custom.db
      - key: PORT
        value: "3000"
    disk:
      name: pathpulse-db
      mountPath: /opt/render/project/src/db
      sizeGB: 1
