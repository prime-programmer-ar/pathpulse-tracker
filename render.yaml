# Render.com deployment config for PathPulse
# Docs: https://render.com/docs/blueprint-spec
#
# Build order (automatic):
#   1. npm install  →  triggers postinstall → prisma generate
#   2. npx prisma db push  →  creates the SQLite schema on the disk mount
#   3. npm run build  →  next build + copies static/ and public/ into standalone/

services:
  - type: web
    name: pathpulse
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/opt/render/project/src/db/custom.db
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
    disk:
      name: pathpulse-db
      mountPath: /opt/render/project/src/db
      sizeGB: 1
